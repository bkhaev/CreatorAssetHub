<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Asset Hub</title>
    <link rel="icon" type="image/png" href="http://localhost/favicon/favicon.png" sizes="16x16"/>
    <link rel="stylesheet" href="https://use.typekit.net/aar7yxx.css">
    <link rel="stylesheet" type="text/css" href="http://localhost/css/destyle.css">
    <link rel="stylesheet" type="text/css" href="http://localhost/css/index.css">
    <link rel="stylesheet" type="text/css" href="http://localhost/fans/page.css">
    <script src="http://localhost/fans/local.js" type="module" defer></script>
</head>
<body class="spectrum">
    <header>
        <nav id="globalnav" class="header-nav-grand" is="bf-header-grand"></nav>
    </header>
    <div id="banner" role="banner" class="spectrum">
        <div class="banner_row">
            <div class="banner_column">
                <div id="userProfileGreeting" class="banner_column_wrapper">
                    <h2 id="prov" class="spectrum-introductory-text">С возвращением, <span class="attn-text">Булат</span>!</h2>
                </div>
            </div>
        </div>
    </div>
    <div id="preloaderArea" class="modal s-hidden s-overlay">
        <div id="globalPreloaderModal" class="_wrapper s-hidden">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="70" height="70">
                <path fill="currentColor" d="M304 48c0 26.51-21.49 48-48 48s-48-21.49-48-48 21.49-48 48-48 48 21.49 48 48zm-48 368c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.49-48-48-48zm208-208c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.49-48-48-48zM96 256c0-26.51-21.49-48-48-48S0 229.49 0 256s21.49 48 48 48 48-21.49 48-48zm12.922 99.078c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48c0-26.509-21.491-48-48-48zm294.156 0c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48c0-26.509-21.49-48-48-48zM108.922 60.922c-26.51 0-48 21.49-48 48s21.49 48 48 48 48-21.49 48-48-21.491-48-48-48z">
                </path>
            </svg>
        </div>
    </div>
    <main>
        <div id="app" class="_wrapper">
            <section id="commonUserPanel" class="section-panel">
                <div id="commonUserFirstBlock">
                    <div id="userGreetingBox">
                        <figure id="userCard" class="user-view-card">
                            <blockquote class="_picture spectrum skeleton"></blockquote>
                            <figcaption class="_text">
                                <div id="userCardFirstText">
                                    <h3><span class="skeleton s-rounded s-text"></span></h3>
                                </div>
                                <div id="userCardSecondText">
                                    <p><span class="skeleton s-rounded s-text"></span></p>
                                </div>
                            </figcaption>
                        </figure>
                        <div id="skeletonText1" class="skeleton s-rounded s-text"></div>
                    </div>
                    <div id="userSpecsBox">
                        <div class="_data-row">
                            <div class="skeleton s-rounded s-text"></div>
                            <div class="skeleton s-rounded s-text"></div>
                        </div>
                    </div>
                </div>
                <div id="commonUserSecondBlock">
                    <section id="userAboutBox" class="_section-box">
                        <h3><span class="skeleton s-rounded s-text"></span></h3>
                        <p>
                            <span class="skeleton s-rounded s-text"></span>
                            <span class="skeleton s-rounded s-text"></span>
                        </p>
                    </section>
                    <section id="userLinksBox" class="_section-box">
                        <h3><span class="skeleton s-rounded s-text"></span></h3>
                        <ul class="__links-list">
                            <li><div class="skeleton s-rounded s-text"></div></li>
                            <li><div class="skeleton s-rounded s-text"></div></li>
                            <li><div class="skeleton s-rounded s-text"></div></li>
                            <li><div class="skeleton s-rounded s-text"></div></li>
                        </ul>
                    </section>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
